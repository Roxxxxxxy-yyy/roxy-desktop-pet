name: Build Windows installer

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.25.0
      - name: Read version
        id: version
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          "value=$version" >> $env:GITHUB_OUTPUT
      - name: Check existing release
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $releases = gh release list --repo $env:GITHUB_REPOSITORY --limit 100 --json tagName | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $tag = "v${{ steps.version.outputs.value }}"
          if ($releases | Where-Object { $_.tagName -eq $tag }) { "found=true" >> $env:GITHUB_OUTPUT }
          else { "found=false" >> $env:GITHUB_OUTPUT }
      - name: Install dependencies
        if: steps.existing.outputs.found == 'false'
        run: pnpm install --frozen-lockfile
      - name: Build installer
        if: steps.existing.outputs.found == 'false'
        run: pnpm run build:win
      - name: Write checksum
        if: steps.existing.outputs.found == 'false'
        shell: pwsh
        run: |
          $file = Get-ChildItem -LiteralPath dist -Filter 'RoxyDesktopPet-Setup-*.exe' | Select-Object -First 1
          if (-not $file) { throw 'Installer not found' }
          $hash = (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($file.Name)" | Set-Content -LiteralPath dist/SHA256SUMS.txt -Encoding ascii
      - name: Save build artifact
        if: steps.existing.outputs.found == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: RoxyDesktopPet-Windows-x64
          path: |
            dist/RoxyDesktopPet-Setup-*.exe
            dist/SHA256SUMS.txt
      - name: Publish GitHub Release
        if: steps.existing.outputs.found == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $file = Get-ChildItem -LiteralPath dist -Filter 'RoxyDesktopPet-Setup-*.exe' | Select-Object -First 1
          gh release create "v${{ steps.version.outputs.value }}" $file.FullName 'dist/SHA256SUMS.txt' --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "洛琪希桌宠 / Roxy Desktop Pet v${{ steps.version.outputs.value }}" --notes-file RELEASE_NOTES.md
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
